# Site configuration
title: "Sean Jain Ellis"
subtitle: "Travel :: Coding :: Music"
description: "You have reached the edge of the Internet."
github: "https://github.com/bandarji"
author: "Sean Jain Ellis"
logo: "https://bandarji.com/images/sjeblog-og-image.png"
image: "https://bandarji.com/images/sjeblog-og-image.png"
og_image: "https://bandarji.com/images/sjeblog-og-image.png"
og_title: "Sean Jain Ellis"
og_description: "Travel :: Coding :: Music"
og_url: "https://bandarji.github.io/"
og_type: "website"
og_locale: "en_US"
og_site_name: "Sean Jain Ellis"
og_image_width: 1200
og_image_height: 630

# Category pages
permalink: /categories/:category/

# Theme configuration (using custom theme)
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Collections for blog
collections:
  blog:
    output: true
    permalink: /blog/:title/

# Defaults for blog posts
defaults:
  - scope:
      path: "_blog"
      type: "blog"
    values:
      layout: "post"
      author: "Sean Jain Ellis"
