# Site configuration
title: "Sean Jain Ellis"
subtitle: "Software Development and Life Adventures"
description: "Personal website and blog covering computing, travel and other life adventures."
github: "https://github.com/bandarji"

# Category pages
permalink: /categories/:category/

# Theme configuration (using custom theme)
plugins:
- jekyll-remote-theme
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Collections for blog
collections:
  blog:
    output: true
    permalink: /blog/:title/

# Defaults for blog posts
defaults:
  - scope:
      path: "_blog"
      type: "blog"
    values:
      layout: "post"
      author: "Sean Jain Ellis"
