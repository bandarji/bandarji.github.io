# Site configuration
title: "Sean Jain Ellis"
subtitle: "Travel :: Coding :: Music"
description: "You have reached the edge of the Internet."
github: "https://github.com/bandarji"
author: "Sean Jain Ellis"
logo: "https://bandarji.com/images/sjeblog-logo.png"

# Category pages
permalink: /categories/:category/

# Theme configuration (using custom theme)
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Collections for blog
collections:
  blog:
    output: true
    permalink: /blog/:title/

# Defaults for blog posts
defaults:
  - scope:
      path: "_blog"
      type: "blog"
    values:
      layout: "post"
      author: "Sean Jain Ellis"
